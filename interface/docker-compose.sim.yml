# Docker Compose for building the wcEcoli simulation image.
#
# The simulation WORKER runs natively on the host (not in a container)
# because it needs Docker socket access to launch simulation containers.
# This file is only used to build the simulation Docker image.
#
# Usage:
#   # Build the simulation image:
#   cd <repo-root>
#   docker compose -f interface/docker-compose.sim.yml build
#
#   # Then start the worker natively:
#   cd interface/backend
#   python -m app.services.sim_worker
#
#   # Or use the convenience script:
#   ./interface/start-worker.sh

services:
  # This service definition is for IMAGE BUILDING only.
  # The actual simulation runs are launched by the worker via `docker run`.
  wcecoli-sim:
    build:
      context: ../
      dockerfile: docker/local/Dockerfile
    image: wcecoli-sim:latest
