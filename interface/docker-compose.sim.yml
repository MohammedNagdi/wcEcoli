# Docker Compose for building the wcEcoli simulation image.
#
# This file only builds the simulation image. The persistent runner and worker
# are started by interface/docker-compose.yml.
#
# Usage:
#   # Build the simulation image:
#   cd <repo-root>
#   docker compose -f interface/docker-compose.sim.yml build

services:
  # Image-building only. Runtime uses the sim-runner service in docker-compose.yml.
  wcecoli-sim:
    build:
      context: ../
      dockerfile: docker/local/Dockerfile
    image: wcecoli-sim:latest
