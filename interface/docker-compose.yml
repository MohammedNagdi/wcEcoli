services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/eval:/app/eval          # assistant eval harness (run via `docker exec ... python -m eval.run_eval`)
      - ./backend/hf_export:/app/hf_export # HF dataset export (run via `docker exec ... python -m hf_export.run_export`)
      - ../reconstruction:/data/reconstruction:rw
      - ../models:/data/models:ro
      - api-db:/app/data
      - sim-output:/data/out
    environment:
      - RECONSTRUCTION_PATH=/data/reconstruction
      - MODELS_PATH=/data/models
      - DATABASE_PATH=/app/data/wcecoli.db
      - SIM_OUTPUT_DIR=/data/out
      - WCECOLI_ROOT=/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - ASSISTANT_PROVIDER=${ASSISTANT_PROVIDER:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)); assert data['status'] == 'ok' and data['database']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.services.sim_worker"]
    volumes:
      - ./backend/app:/app/app
      - ../reconstruction:/data/reconstruction:ro
      - ../models:/data/models:ro
      - api-db:/app/data
      - sim-output:/data/out
    environment:
      - RECONSTRUCTION_PATH=/data/reconstruction
      - MODELS_PATH=/data/models
      - DATABASE_PATH=/app/data/wcecoli.db
      - WCECOLI_ROOT=/data
      - SIM_OUTPUT_DIR=/data/out
      - DOCKER_IMAGE=wcecoli-sim:latest
      - PARCA_CPUS=${PARCA_CPUS:-8}
      - PARCA_MAX_CONCURRENCY=${PARCA_MAX_CONCURRENCY:-1}
      - SIM_RUNNER_SOCKET=/data/out/.runner/control.sock
      - SIM_RUNNER_CONCURRENCY=${SIM_RUNNER_CONCURRENCY:-1}
      - SIM_RUNNER_CPU_BUDGET=${SIM_RUNNER_CPU_BUDGET:-8}
      - SIM_CPUS_PER_JOB=${SIM_CPUS_PER_JOB:-1}
      - RUNNER_POLL_INTERVAL=${RUNNER_POLL_INTERVAL:-1}
      - WORKER_LEASE_TIMEOUT=${WORKER_LEASE_TIMEOUT:-300}
      - WORKER_SHUTDOWN_GRACE_SEC=${WORKER_SHUTDOWN_GRACE_SEC:-1800}
    depends_on:
      api:
        condition: service_healthy
      sim-runner:
        condition: service_healthy
    restart: unless-stopped

  sim-runner:
    build:
      context: ../
      dockerfile: docker/local/Dockerfile
    image: wcecoli-sim:latest
    command: ["python", "runscripts/manual/simRunner.py"]
    init: true
    volumes:
      - ../reconstruction:/wcEcoli/reconstruction:ro
      - ../models:/wcEcoli/models:ro
      - sim-output:/wcEcoli/out
    environment:
      - SIM_RUNNER_SOCKET=/wcEcoli/out/.runner/control.sock
      - SIM_RUNNER_CONCURRENCY=${SIM_RUNNER_CONCURRENCY:-1}
      - SIM_RUNNER_CPU_BUDGET=${SIM_RUNNER_CPU_BUDGET:-8}
      - SIM_CPUS_PER_JOB=${SIM_CPUS_PER_JOB:-1}
      - PARCA_MAX_CONCURRENCY=${PARCA_MAX_CONCURRENCY:-1}
      - WORKER_SHUTDOWN_GRACE_SEC=${WORKER_SHUTDOWN_GRACE_SEC:-1800}
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    cpus: ${SIM_RUNNER_CPU_BUDGET:-8}
    mem_limit: ${SIM_RUNNER_MEMORY_LIMIT:-0}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, socket; s=socket.socket(socket.AF_UNIX); s.connect('/wcEcoli/out/.runner/control.sock');
          s.sendall(b'{"command":"health"}\n'); data=json.loads(s.recv(4096)); assert data['ok'] and data['result']['status'] == 'ok'
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-db:
  sim-output:
