[project]
name = "wcecoli-api"
version = "0.1.0"
description = "REST API for the wcEcoli whole-cell model platform"
requires-python = ">=3.11"
# Pinned to the exact tested versions for reproducible builds (direct deps). A full transitive
# lockfile (uv.lock / pip-compile) is the remaining follow-up for hermetic rebuilds.
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlmodel==0.0.38",
    "aiosqlite==0.22.1",
    "h5py==3.16.0",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "ruff==0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
